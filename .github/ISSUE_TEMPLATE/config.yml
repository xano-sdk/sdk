# Blank issues stay on: a report that fits neither form is still worth having.
blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/xanots/sdk/security/advisories/new
    about: >-
      Do not open a public issue. Report it privately through a GitHub security
      advisory — see SECURITY.md.
  - name: Question about Xano itself
    url: https://docs.xano.com
    about: >-
      For the Xano platform rather than this SDK — the product docs and Xano
      support are the right place.
