name: Publish

# Runs in the public repository when a release tag arrives: publishes the
# package to npm with provenance, then creates the GitHub release from the
# tag's notes. The tag comes from the private repository's mirror workflow,
# which writes the release title and notes into the annotated tag.
#
# Uses npm trusted publishing (OIDC), so no npm token is stored. Provenance
# needs a GitHub-hosted runner, so this one stays on `ubuntu-latest`.
#
# Safe to re-run: a version already on npm is not published again, and a
# release that already exists is left alone.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'xano-sdk/sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # The checkout leaves a lightweight ref; fetch the annotated tag for its notes.
      - run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check the tag matches package.json
        id: version
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping the publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.published != 'true'
        run: npm ci
      - if: steps.version.outputs.published != 'true'
        run: npm run typecheck
      - if: steps.version.outputs.published != 'true'
        run: npm run build
      # The public package.json carries no prepack hook, so the dist guard runs here.
      - if: steps.version.outputs.published != 'true'
        run: node scripts/check-dist.mjs
      - if: steps.version.outputs.published != 'true'
        run: npm publish --provenance --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          title="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "${title:-$GITHUB_REF_NAME}" --notes-file notes.md
